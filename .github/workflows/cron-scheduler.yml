name: Run-5-Minutes
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    environment: Production
    strategy:
      fail-fast: false
      matrix:
        wpe_env: [WPE_DEV, WPE_STG]
    concurrency:
      group: wp-cron-${{ matrix.wpe_env }}
      cancel-in-progress: false
    env:
      WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
      GHA_RUN_NO: ${{ github.run_number }}
      GHA_RUN_ID: ${{ github.run_id }}
      GHA_REPO: ${{ github.repository }}
      WPE_ENV: ${{ matrix.wpe_env }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Run Script (${{ matrix.wpe_env }})
      run: |
        chmod +x script.sh
        ./script.sh
